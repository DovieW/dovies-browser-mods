name: UI runtime experiment
on:
  workflow_dispatch:
  push:
    paths: ["experiments/ui-runtime/**", ".github/workflows/ui-runtime.yml"]
  pull_request:
    paths: ["experiments/ui-runtime/**", ".github/workflows/ui-runtime.yml"]
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            experiments/ui-runtime/package-lock.json
      - run: npm ci
      - run: npm ci --prefix experiments/ui-runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run compare --prefix experiments/ui-runtime
        env:
          MODS_UI_ROUNDS: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-runtime-experiment
          path: experiments/ui-runtime/test-results/
          if-no-files-found: ignore
